<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NSL Greenhouse Dashboard</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#edf2f7;font:15px system-ui}main{max-width:1200px;margin:auto;padding:25px}.top{display:flex;justify-content:space-between;align-items:center}.pill{padding:8px 12px;border-radius:999px;background:#172238}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:18px 0}.card,.panel{background:#141c2f;border:1px solid #2b3750;border-radius:18px;padding:18px}.value{font-size:29px;font-weight:800;margin-top:7px}.ok{color:#5ee58b}.danger{color:#ff7777}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}input{width:100%;padding:10px;background:#0d1425;color:white;border:1px solid #35415d;border-radius:9px}button{border:0;border-radius:9px;padding:10px 14px;margin:4px;background:#4ade80;font-weight:800;cursor:pointer}.off{background:#344054;color:white}.chart{height:330px}.actions{display:flex;flex-wrap:wrap;gap:4px}</style></head><body><main><div class="top"><div><h1>🌱 NSL Greenhouse</h1><div>ESP32 → Cloud → Dashboard</div></div><div><span id="cloudStatus" class="pill">...</span> <button onclick="logout()">Đăng xuất</button></div></div><div class="grid"><div class="card">🌱 Đất A<div id="soilA" class="value">--</div></div><div class="card">🌱 Đất B<div id="soilB" class="value">--</div></div><div class="card">🌡️ Nhiệt độ<div id="temp" class="value">--</div></div><div class="card">💧 Độ ẩm<div id="hum" class="value">--</div></div><div class="card">💨 Khói<div id="smoke" class="value">--</div></div><div class="card">🌧️ Mưa<div id="rain" class="value">--</div></div><div class="card">💦 Bơm<div id="pump" class="value">--</div></div><div class="card">🌀 Quạt<div id="fan" class="value">--</div></div><div class="card">🚨 Cảnh báo<div id="alarm" class="value">--</div></div><div class="card">📡 ESP32<div id="esp" class="value" style="font-size:20px">--</div><small id="lastSeen"></small></div></div><section class="panel"><h2>📈 Lịch sử 60 mẫu gần nhất</h2><div class="chart"><canvas id="historyChart"></canvas></div></section><section class="panel"><h2>🎛️ Điều khiển</h2><div class="actions"><button onclick="manual(true,true)">💦 Bật bơm</button><button class="off" onclick="manual(true,false)">Tắt bơm</button><button onclick="manual(false,true)">🌀 Bật quạt</button><button class="off" onclick="manual(false,false)">Tắt quạt</button></div></section><section class="panel"><h2>⚙️ Cài đặt</h2><div class="controls"><label>Đất khô %<input id="dry" type="number"></label><label>Nhiệt độ quạt °C<input id="highTemp" type="number" step=".1"></label><label>Ngưỡng khói<input id="smokeThreshold" type="number"></label><label>Ngưỡng mưa<input id="rainThreshold" type="number"></label></div><p><label><input id="autoMode" type="checkbox" style="width:auto"> Chế độ tự động</label></p><button onclick="save()">Lưu cài đặt</button> <span id="saveMsg"></span></section></main><script src="dashboard.js"></script></body></html>
