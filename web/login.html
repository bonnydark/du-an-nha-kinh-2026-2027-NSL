<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NSL • Đăng nhập</title><style>body{margin:0;background:#0b1020;color:#eef2f7;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.box{width:min(390px,90vw);padding:28px;background:#141c2f;border:1px solid #2b3750;border-radius:20px}input,button{width:100%;padding:12px;margin-top:10px;border-radius:10px;box-sizing:border-box}input{background:#0d1425;color:white;border:1px solid #35415d}button{border:0;background:#4ade80;font-weight:800;cursor:pointer}.err{color:#ff7777}</style></head><body><div class="box"><h1>🌱 NSL Greenhouse</h1><p>Đăng nhập hệ thống quản lý nhà kính</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Mật khẩu"><button onclick="login()">Đăng nhập</button><p id="msg" class="err"></p></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const p=new URLSearchParams(location.search);const url=p.get('url')||localStorage.nsl_url||'';const key=p.get('key')||localStorage.nsl_key||'';if(!url||!key)msg.textContent='Chưa cấu hình Supabase URL/anon key';else{localStorage.nsl_url=url;localStorage.nsl_key=key;window.sb=supabase.createClient(url,key)}async function login(){msg.textContent='';if(!window.sb)return;const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error){msg.textContent=error.message;return}location.href='index.html'}</script></body></html>
