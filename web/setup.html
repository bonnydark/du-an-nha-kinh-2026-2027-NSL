<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NSL • Cấu hình</title><style>body{margin:0;background:#0b1020;color:#eef2f7;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.box{width:min(650px,90vw);padding:28px;background:#141c2f;border:1px solid #2b3750;border-radius:20px}input{width:100%;padding:12px;margin:8px 0 14px;border-radius:10px;box-sizing:border-box;background:#0d1425;color:white;border:1px solid #35415d}button{padding:12px 18px;border:0;border-radius:10px;background:#4ade80;font-weight:800;cursor:pointer}.hint{color:#aab4c5}</style></head><body><div class="box"><h1>⚙️ NSL Cloud Setup</h1><p class="hint">Nhập Supabase URL và anon key. Chỉ dùng anon key ở trình duyệt.</p><label>Supabase URL<input id="url" placeholder="https://xxxxx.supabase.co"></label><label>Supabase anon key<input id="key" placeholder="eyJ..."></label><button onclick="save()">Lưu & mở đăng nhập</button><p id="msg"></p></div><script>function save(){if(!url.value||!key.value){msg.textContent='Vui lòng nhập đủ thông tin';return}localStorage.nsl_url=url.value.trim();localStorage.nsl_key=key.value.trim();location.href='login.html'}</script></body></html>
